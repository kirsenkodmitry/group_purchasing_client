<div class="card" style="width: 18rem;">
  <img src="https://tornado.shop/images/detailed/3/P1023495.jpg"
       class="card-img-top"
       alt="{{name}}"
       width="300"
       height="300">

  <div class="card-body text-center">
    <h5 class="card-title">{{name}}</h5>
    <p class="card-text">{{price}}$</p>
    <p *ngIf="isReserved(id)" class="card-text">Зарезервировано {{qty}} штук</p>

    <!-- Индикатор очереди -->
    <div class="my-3">
      <svg width="150" height="80" viewBox="0 0 150 80">
        <!-- фон -->
        <circle [attr.r]="radius"
                cx="75" cy="75"
                fill="none"
                stroke="#e0e0e0"
                stroke-width="8"
                [attr.stroke-dasharray]="halfCircumference + ' ' + circumference"
                stroke-dashoffset="0"
                transform="rotate(-180, 75, 75)" />

        <!-- прогресс -->
        <circle [attr.r]="radius"
                cx="75" cy="75"
                fill="none"
                stroke="#007bff"
                stroke-width="8"
                [attr.stroke-dasharray]="dashArray"
                stroke-linecap="butt"
                transform="rotate(-180, 75, 75)"
                style="transition: 0.3s linear;" />

        <!-- текст -->
        <text x="75" y="65" text-anchor="middle" alignment-baseline="middle"
              font-size="14" font-family="sans-serif" fill="#333">
          {{progressPercent | number:'1.0-0'}}%
        </text>
      </svg>

      <p class="small text-muted">
        {{actualReserv}} / {{requiredReserv}} откликов
      </p>
    </div>

    <button *ngIf="isReserved(id)" class="btn btn-danger" >Зарезервировано</button>
    <button *ngIf="isReserved(id)" (click)="removeProduct(id)" class="btn btn-danger" ><i class="bi bi-trash-fill"></i></button>

    <button *ngIf="isReserved(id)" (click)="openEditPart()" class="btn btn-dark" ><i class="bi bi-pencil-fill"></i></button>
    <input *ngIf="showEditPart" type="range" min="0" max="{{actualReserv - qty}}" [(ngModel)]="editQtyValue">
    <p *ngIf="showEditPart">Текущее значение: {{editQtyValue}}</p>
    <button *ngIf="showEditPart" (click)="editQty(id, editQtyValue)" class="btn btn-dark" >Изменить</button>


    <button *ngIf="!isReserved(id)" class="btn btn-primary" (click)="openReservePart()">Зарезервировать</button>

    <input *ngIf="showReservePart" type="range" min="0" max="{{requiredReserv - actualReserv}}" [(ngModel)]="qty">
    <p *ngIf="showReservePart">Текущее значение: {{qty}}</p>
    <button *ngIf="!isReserved(id) && showReservePart" class="btn btn-primary" (click) = "reserve(id)">Зарезервировать</button>
  </div>
</div>
