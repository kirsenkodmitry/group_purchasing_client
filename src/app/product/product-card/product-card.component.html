<div class="card" style="width: 18rem;">
  <img src="https://tornado.shop/images/detailed/3/P1023495.jpg" class="card-img-top" alt="{{name}}" width="300" height="300">
  <div class="card-body">
    <h5 class="card-title">{{name}}</h5>
    <p class="card-text">{{price}}$</p>
    <a href="/addToCart?id={{id}}" class="btn btn-primary">Добавить в корзину</a>
  </div>
</div>
