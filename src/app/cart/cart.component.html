<div class="container py-5 text-dark">
  <div class="card shadow-lg border-0 rounded-4 bg-white">
    <div class="card-body">
      <h2 class="mb-4 text-center fw-bold text-uppercase">🛒 Ваша корзина</h2>

      <table class="table table-hover align-middle text-center">
        <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Товар</th>
          <th>Количество</th>
          <th>Сумма</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let product of products; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ product.product.name }}</td>
          <td>
            <div class="d-flex justify-content-center align-items-center">
              <button
                class="btn btn-sm btn-outline-dark rounded-circle me-2"
                (click)="decreaseQuantity(product)"
              >
                −
              </button>
              <span class="fw-bold">{{ product.quantity }}</span>
              <button
                class="btn btn-sm btn-outline-dark rounded-circle ms-2"
                (click)="increaseQuantity(product)">
                +
              </button>
            </div>
          </td>
          <td>{{ product.amount | currency:'RUB':'symbol-narrow':'1.0-0' }}</td>
          <td>
            <button
              class="btn btn-sm btn-outline-danger"
              (click)="removeProduct(product)">
              ✕ Удалить
            </button>
          </td>
        </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <h4 class="fw-bold">
          Итого:
          <span class="text-dark">{{ getTotal() | currency:'RUB':'symbol-narrow':'1.0-0' }}</span>
        </h4>
        <button
          class="btn btn-dark btn-lg rounded-3 px-5"
          (click)="checkout()">
          Оформить заказ
        </button>
      </div>
    </div>
  </div>
</div>
